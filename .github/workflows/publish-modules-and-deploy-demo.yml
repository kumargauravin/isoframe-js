name: Publish modules and deploy demo

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  publish-modules:
    runs-on: ubuntu-latest
    if: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish workspace modules
        uses: ./.github/actions/publish-modules
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

  build-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build static demo
        env:
          NEXT_PUBLIC_BASE_PATH: /isoframe-js
        run: npm run build --workspace demo-react

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo-react/out

  deploy-demo:
    runs-on: ubuntu-latest
    needs: build-demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
