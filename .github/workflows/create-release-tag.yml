name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.2.0)
        required: true
        default: 1.0.0
      release_notes:
        description: Release notes
        required: false
        default: New release
      bump-strategy:
        description: Version bump strategy
        required: true
        type: choice
        default: monorepo
        options:
          - single
          - monorepo
      package-path:
        description: Package path used when bump-strategy=single
        required: false
        default: packages/isoframe

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump versions
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.bump-strategy }}" = "single" ]; then
            pkg="${{ github.event.inputs.package-path }}"
            if [ ! -f "$pkg/package.json" ]; then
              echo "Package not found: $pkg"
              exit 1
            fi
            (cd "$pkg" && npm version ${{ github.event.inputs.version }} --no-git-tag-version)
            git add "$pkg/package.json"
          else
            for pkg in packages/isoframe packages/isocsv packages/isojson packages/isoframe-react; do
              (cd "$pkg" && npm version ${{ github.event.inputs.version }} --no-git-tag-version)
              git add "$pkg/package.json"
            done
          fi

          if git diff --cached --quiet; then
            echo "No version changes detected; skipping commit."
          else
            git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
            git push origin main
          fi

      - name: Create and push tag
        run: |
          if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ github.event.inputs.version }} already exists"
          else
            git tag v${{ github.event.inputs.version }}
            git push origin v${{ github.event.inputs.version }}
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
