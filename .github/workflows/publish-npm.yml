name: Publish @nice-tools packages to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish workspace modules
        if: ${{ secrets.NPM_TOKEN }}
        uses: ./.github/actions/publish-modules
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          node-version: '22'
          packages: '["packages/isoframe","packages/isocsv","packages/isojson","packages/isoframe-react"]'

      - name: Skip publish (missing NPM_TOKEN)
        if: ${{ !secrets.NPM_TOKEN }}
        run: echo "NPM_TOKEN is not configured; skipping module publish."

      - name: Create Git tag if missing
        if: github.event_name == 'workflow_dispatch' && secrets.NPM_TOKEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./packages/isoframe/package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Trigger GitHub Pages redeploy
        if: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'trigger-deploy.yml',
                ref: 'main',
                inputs: {
                  reason: 'Triggered after npm publish workflow'
                }
              });
              console.log('Trigger-deploy workflow dispatched successfully.');
            } catch (e) {
              console.log('Could not trigger deploy workflow:', e.message);
            }
